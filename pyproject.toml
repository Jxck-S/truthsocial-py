[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truthpy"
version = "0.1.0"
description = "An unofficial typed Python client for Truth Social"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
]
keywords = ["truth-social", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Jxck-S/truthpy"
Repository = "https://github.com/Jxck-S/truthpy"
Issues = "https://github.com/Jxck-S/truthpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truthpy = ["py.typed"]
